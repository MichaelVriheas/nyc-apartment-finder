name: Refresh data and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *" # Check free monthly FirstMover data daily
    - cron: "7 14 * * 1"  # Check RentCast once per week (two API requests)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nyc-apartment-publish-and-api-budget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reserve budget, fetch RentCast, and persist results
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '7 14 * * 1' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rentcast-test]')) }}
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENTCAST_API_KEY:-}" ]; then
            echo "::error::RENTCAST_API_KEY is not available to this workflow"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always start from the latest committed ledger, including manual run reruns.
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/fetch_rentcast.py reserve
          # Push the reservation BEFORE any billable request. A failed push blocks the fetch.
          if [ -n "$(git status --porcelain -- .rentcast-budget.json)" ]; then
            git add .rentcast-budget.json
            git commit -m "Reserve RentCast request budget [skip ci]"
            git push origin main
          fi
          python scripts/fetch_rentcast.py fetch
          if [ -f site/data/rentcast.json ]; then
            git add site/data/rentcast.json
            if ! git diff --cached --quiet; then
              git commit -m "Update RentCast snapshot [skip ci]"
              git push origin main
            fi
          fi

      - name: Import latest public FirstMover historical snapshot
        run: python scripts/update_listings.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
