name: Refresh data and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *" # Check free monthly FirstMover data daily
    - cron: "7 14 * * 1"  # Check RentCast once per week (two reserved API requests)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nyc-apartment-publish-and-api-budget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test RentCast comparison and API budget (offline)
        run: python -m unittest discover -s tests -v
      - name: Test homepage JavaScript and room-only filters (offline)
        run: node tests/check_frontend.cjs
      - name: Smoke-test marketplace first load and comparison reload (offline)
        run: node tests/check_runtime.cjs
      - name: Test map pin hover previews and listing links (offline)
        run: node tests/check_map.cjs

      - name: Reserve budget, fetch RentCast, and persist results
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '7 14 * * 1' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rentcast-test]')) }}
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENTCAST_API_KEY:-}" ]; then
            echo "::error::RENTCAST_API_KEY is not available to this workflow"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always start from the latest committed ledger, including manual run reruns.
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python -m scripts.fetch_rentcast reserve
          # Push the reservation BEFORE any billable request. A failed push blocks the fetch.
          if [ -n "$(git status --porcelain -- .rentcast-budget.json)" ]; then
            git add .rentcast-budget.json
            git commit -m "Reserve RentCast request budget [skip ci]"
            git push origin main
          fi
          python -m scripts.fetch_rentcast fetch
          if [ -f site/data/rentcast.json ] && [ -f site/data/market-history.json ]; then
            # One atomic commit preserves the exact data + observed historical summary.
            git add site/data/rentcast.json site/data/market-history.json
            if ! git diff --cached --quiet; then
              git commit -m "Update RentCast snapshot and observed market history [skip ci]"
              git push origin main
            fi
          else
            echo "::error::Both RentCast snapshot and market history are required"
            exit 1
          fi

      - name: Import latest public FirstMover historical snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.update_listings
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Allow GitHub artifact index to update
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
